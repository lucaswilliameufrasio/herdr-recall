<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Name}}</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/components.css">
</head>
<body>
<main class="shell">
<header class="banner">
<span class="mark" aria-hidden="true"></span>
<h1 class="title">{{.Name}}</h1>
<form method="post" action="/acesso/sair">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button class="button-secondary" type="submit">Sair</button>
</form>
</header>
{{if eq .Page "machines"}}{{template "machines" .Machines}}{{end}}
{{if eq .Page "detail"}}{{template "detail" .Detail}}{{end}}
</main>
{{if .Page}}<script src="/assets/panel.js" defer></script>{{end}}
</body>
</html>
